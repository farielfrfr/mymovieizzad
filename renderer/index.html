<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyMovie - Search & Suggestion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>MyMovie Plan App</h1>
  <div class="nav-bar">
    <button id="openWatchlistBtn">Open Watchlist Window</button>
  </div>

  <div class="card">
    <h2>Search Movie</h2>
    <div class="input-group">
      <input type="text" id="movieTitle" placeholder="Enter movie title..." />
      <button id="searchBtn">Search</button>
    </div>
    <div id="movieResult" class="result-box"></div>
  </div>

  <div class="card">
    <h2>Movie Suggestion Engine</h2>
    <div class="input-group">
      <select id="genreSelect">
        <option value="">-- Select Preferred Genre --</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Horror">Horror</option>
        <option value="Sci-Fi">Sci-Fi</option>
      </select>

      <select id="timeSelect">
        <option value="">-- Available Time --</option>
        <option value="Short">Short Movie (&lt; 100 mins)</option>
        <option value="Standard">Standard Movie (100 - 140 mins)</option>
        <option value="Epic">Epic / Long Movie (&gt; 140 mins)</option>
      </select>

      <button id="suggestBtn">Get Suggestion</button>
    </div>
    <div id="suggestionResult" class="result-box"></div>
  </div>

  <div class="card">
    <h2>Movie Watchtime Calculator</h2>
    <div class="input-group">
      <input type="number" id="runtimeInput" placeholder="Runtime per movie (mins)" min="1" />
      <input type="number" id="countInput" placeholder="Number of movies" min="1" />
      <button id="calcBtn">Calculate</button>
    </div>
    <div id="calcResult" class="result-box"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
